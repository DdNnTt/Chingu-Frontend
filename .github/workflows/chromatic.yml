name: Chromatic Deployment

on:
  pull_request:
    branches: ["main", "develop"]
    paths:
      - ".storybook/**"
      - "src/components/common/**.stories.tsx"

permissions:
  contents: write
  pages: write
  deployments: write
  id-token: write
  issues: write
  pull-requests: write

jobs:
  storybook-preview:
    runs-on: ubuntu-20.04
    steps:
      # 최신 코드 체크아웃
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # 캐싱
      - name: Cache Dependencies
        id: cache
        uses: actions/cache@v3
        with:
          path: "**/node_modules"
          key: ${{ runner.os }}-node-${{ hashFiles('**/yarn.lock') }}-storybook

      # 종속성 설치
      - name: Install Dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: yarn install

      # Chromatic에 배포
      - name: Publish to Chromatic
        id: chromatic
        uses: chromaui/action@v1
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          token: ${{ secrets.GITHUB_TOKEN }}
          onlyChanged: true
          autoAcceptChanges: true

      # Chromatic URL을 job outputs에 세팅
      - name: Set Storybook URL
        id: set-storybook-url
        run: |
          echo "storybook_url=${{ steps.chromatic.outputs.storybookUrl }}" >> $GITHUB_OUTPUT
          echo "Storybook URL => ${{ steps.chromatic.outputs.storybookUrl }}"

      # 현재 시간
      - name: Get Current Time
        id: current-time
        uses: josStorer/get-current-time@v2
        with:
          format: "YYYY-MM-DD HH:mm:ss"
          utcOffset: "+09:00"

    outputs:
      # Set Storybook URL 단계에서 쓰인 storybook_url
      storybook_url: ${{ steps.set-storybook-url.outputs.storybook_url }}
      # 현재 시간
      current_time: ${{ steps.current-time.outputs.formattedTime }}

  github-bot-storybook:
    runs-on: ubuntu-latest
    needs: [storybook-preview]
    steps:
      # PR 코멘트
      - name: Comment on Pull Request
        uses: thollander/actions-comment-pull-request@v2
        with:
          comment_tag: ${{ github.event.number }}-storybook
          message: |
            💄 **Storybook Preview Deployment Complete!**  
            🔗 **[View Storybook](${{ needs.storybook-preview.outputs.storybook_url }})**  
            🕖 Last Updated: ${{ needs.storybook-preview.outputs.current_time }}