name: Chromatic Deployment

on:
  pull_request:
    branches: ["main", "develop"]

permissions:
  contents: write
  pages: write
  deployments: write
  id-token: write
  issues: write
  pull-requests: write

jobs:
  storybook-preview:
    runs-on: ubuntu-20.04
    steps:
      # GitHub 저장소의 최신 코드 가져오기
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # 캐싱해서 빌드 속도 향상
      - name: Cache Dependencies
        id: cache
        uses: actions/cache@v3
        with:
          path: "**/node_modules"
          key: ${{ runner.os }}-node-${{ hashFiles('**/yarn.lock') }}-storybook

      # 종속성 설치
      - name: Install Dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: yarn install

      # Chromatic에 배포
      - name: Publish to Chromatic
        id: chromatic
        uses: chromaui/action@v1
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          token: ${{ secrets.GITHUB_TOKEN }}
          onlyChanged: true
          autoAcceptChanges: true

      # (디버깅) Chromatic에서 받은 URL을 로그로 출력
      - name: Print Chromatic WebURL (Debug)
        run: echo "Chromatic webUrl: ${{ steps.chromatic.outputs.webUrl }}"

      # 현재 시간을 가져와서 PR 코멘트에 추가
      - name: Get Current Time
        id: current-time
        uses: josStorer/get-current-time@v2
        with:
          format: "YYYY-MM-DD HH:mm:ss"
          utcOffset: "+09:00"

    outputs:
      # Chromatic Actions에서 제공되는 webUrl로 Storybook URL 가져오기
      storybook_url: ${{ steps.chromatic.outputs.webUrl }}
      current_time: ${{ steps.current-time.outputs.formattedTime }}

  github-bot-storybook:
    runs-on: ubuntu-latest
    needs: [storybook-preview]
    steps:
      # Storybook URL을 PR 코멘트 작성 전에 로그로 출력
      - name: Debug Outputs (Print Storybook URL)
        run: echo "Storybook URL from previous job: ${{ needs.storybook-preview.outputs.storybook_url }}"

      # PR에 Storybook 배포 결과를 자동으로 코멘트
      - name: Comment on Pull Request
        uses: thollander/actions-comment-pull-request@v2
        with:
          comment_tag: ${{ github.event.number }}-storybook
          message: |
            💄 **Storybook Preview Deployment Complete!**  
            🔗 **[View Storybook](${{ needs.storybook-preview.outputs.storybook_url }})**  
            🕖 Last Updated: ${{ needs.storybook-preview.outputs.current_time }}