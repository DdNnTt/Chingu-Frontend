name: Chromatic Deployment

on:
  pull_request:
    branches: ["main", "develop"]

permissions:
  contents: write
  pages: write
  deployments: write
  id-token: write
  issues: write
  pull-requests: write

jobs:
  storybook-preview:
    runs-on: ubuntu-20.04
    steps:
      # GitHub 저장소의 최신 코드 가져오기
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # 캐싱해서 빌드 속도 향상
      - name: Cache Dependencies
        id: cache
        uses: actions/cache@v3
        with:
          path: "**/node_modules"
          key: ${{ runner.os }}-node-${{ hashFiles('**/yarn.lock') }}-storybook

      # 종속성 설치
      - name: Install Dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: yarn install

      # Chromatic에 배포
      - name: Publish to Chromatic
        id: chromatic
        uses: chromaui/action@v1
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          token: ${{ secrets.GITHUB_TOKEN }}
          onlyChanged: true
          autoAcceptChanges: true

      # Chromatic에서 받은 URL을 환경 변수로 저장
      - name: Save Storybook URL to Environment
        run: echo "STORYBOOK_URL=${{ steps.chromatic.outputs.webUrl }}" >> $GITHUB_ENV

      # 현재 시간을 가져와서 PR 코멘트에 추가
      - name: Get Current Time
        id: current-time
        uses: josStorer/get-current-time@v2
        with:
          format: "YYYY-MM-DD HH:mm:ss"
          utcOffset: "+09:00"

    outputs:
      # 환경 변수에서 Storybook URL을 가져와서 저장
      storybook_url: ${{ env.STORYBOOK_URL }}
      current_time: ${{ steps.current-time.outputs.formattedTime }}

  github-bot-storybook:
    runs-on: ubuntu-latest
    needs: [storybook-preview]
    steps:
      # 이전 Job에서 저장한 환경 변수를 로드
      - name: Load Storybook URL
        run: echo "STORYBOOK_URL=${{ needs.storybook-preview.outputs.storybook_url }}" >> $GITHUB_ENV

      # PR에 Storybook 배포 결과를 자동으로 코멘트
      - name: Comment on Pull Request
        uses: thollander/actions-comment-pull-request@v2
        with:
          comment_tag: ${{ github.event.number }}-storybook
          message: |
            💄 **Storybook Preview Deployment Complete!**  
            🔗 **[View Storybook](${{ env.STORYBOOK_URL }})**  
            🕖 Last Updated: ${{ needs.storybook-preview.outputs.current_time }}